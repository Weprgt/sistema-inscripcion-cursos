<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cursos | Sistema de inscripciones</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #243247;
            background: #f3f5f8;
        }

        header {
            padding: 22px 6%;
            color: white;
            background: #243247;
        }

        main {
            max-width: 1150px;
            margin: 36px auto;
            padding: 0 20px;
        }

        .panel {
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px #0000000d;
        }

        h1 {
            margin-top: 0;
        }

        .descripcion {
            color: #64748b;
        }

        .tabla {
            overflow-x: auto;
        }

        table {
            width: 100%;
            margin-top: 24px;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f8fafc;
        }

        .estado {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 13px;
        }

        .activo {
            color: #166534;
            background: #dcfce7;
        }

        .inactivo {
            color: #475569;
            background: #e2e8f0;
        }

        .vacio {
            padding: 36px 0;
            text-align: center;
            color: #64748b;
        }
    </style>
</head>

<body>
<header>
    <strong>Sistema de inscripción a cursos</strong>
</header>
<nav aria-label="Navegación principal"
     style="padding: 16px 6%; background: white;
            display: flex; flex-wrap: wrap; gap: 24px;">
    <a th:href="@{/cursos}">Cursos</a>
    <a th:href="@{/participantes}">Participantes</a>
    <a th:href="@{/inscripciones}">Inscripciones</a>
</nav>
<main>
    <section class="panel">
        <h1>Cursos</h1>
        <p class="descripcion">
            Consulta los cursos registrados y su estado.
        </p>

        <p th:if="${mensajeExito}"
           th:text="${mensajeExito}"
           role="status"
           style="color: #166534;">
        </p>

        <div th:if="${errorListado}" role="alert">
            <p th:text="${errorListado}" style="color: #b91c1c;"></p>
            <a th:href="@{/cursos}">Reintentar</a>
        </div>

        <p>
            <a th:href="@{/cursos/nuevo}">+ Registrar curso</a>
        </p>

        <div class="tabla" th:unless="${#lists.isEmpty(cursos)}">
            <table>
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Modalidad</th>
                    <th>Fecha de inicio</th>
                    <th>Cupo total</th>
                    <th>Estado</th>
                    <th>Acciones</th>

                </tr>
                </thead>

                <tbody>
                <tr th:each="curso : ${cursos}">
                    <td th:text="${curso.codigo}"></td>
                    <td th:text="${curso.nombre}"></td>
                    <td th:text="${curso.modalidad}"></td>
                    <td th:text="${curso.fechaInicio}"></td>
                    <td th:text="${curso.cupo}"></td>
                    <td>
                        <a th:href="@{/cursos/{id}(id=${curso.id})}">
                            Ver detalle
                        </a>
                        <span> | </span>
                        <a th:href="@{/cursos/{id}/editar(id=${curso.id})}">
                            Editar
                        </a>
                        <form th:action="@{/cursos/{id}/eliminar(id=${curso.id})}"
                              method="post"
                              style="display: inline;"
                              onsubmit="return confirm('¿Eliminar este curso definitivamente?');">
                            <button type="submit">Eliminar</button>
                        </form>
                    </td>
                    <td>
                        <span class="estado"
                              th:classappend="${curso.activo == true}
                                  ? 'activo' : 'inactivo'"
                              th:text="${curso.activo == true}
                                  ? 'Activo' : 'Inactivo'">
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
