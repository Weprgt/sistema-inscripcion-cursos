<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Curso | Sistema de inscripción a cursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container flex-wrap">
        <a class="navbar-brand" th:href="@{/}">Sistema de inscripción a cursos</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navegacionPrincipal" aria-controls="navegacionPrincipal"
                aria-expanded="false" aria-label="Mostrar navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navegacionPrincipal">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/}">Inicio</a>
                <a class="nav-link active" th:href="@{/cursos}">Cursos</a>
                <a class="nav-link" th:href="@{/participantes}">Participantes</a>
                <a class="nav-link" th:href="@{/inscripciones}">Inscripciones</a>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4 py-md-5">
    <div class="mx-auto" style="max-width: 850px;">
        <section class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h2"
                    th:text="${idCurso != null} ? 'Editar curso' : 'Registrar curso'">
                    Registrar curso
                </h1>
                <p class="text-secondary mb-4">Todos los campos son obligatorios.</p>

                <form th:action="${idCurso != null}
                  ? @{/cursos/{id}(id=${idCurso})} : @{/cursos}"
                      th:object="${curso}"
                      method="post">

                    <div class="alert alert-danger"
                         role="alert"
                         th:if="${#fields.hasGlobalErrors()}">
                        <p class="mb-0" th:each="error : ${#fields.globalErrors()}"
                           th:text="${error}"></p>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="codigo">Código</label>
                            <input class="form-control" id="codigo" type="text"
                                   th:field="*{codigo}" maxlength="20" required>
                            <div class="text-danger small mt-1" th:errors="*{codigo}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="nombre">Nombre</label>
                            <input class="form-control" id="nombre" type="text"
                                   th:field="*{nombre}" maxlength="100" required>
                            <div class="text-danger small mt-1" th:errors="*{nombre}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label" for="descripcion">Descripción</label>
                            <textarea class="form-control" id="descripcion"
                                      th:field="*{descripcion}" maxlength="500"
                                      rows="4" required></textarea>
                            <div class="text-danger small mt-1" th:errors="*{descripcion}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="modalidad">Modalidad</label>
                            <select class="form-select" id="modalidad"
                                    th:field="*{modalidad}" required>
                                <option value="">Selecciona una modalidad</option>
                                <option value="PRESENCIAL">Presencial</option>
                                <option value="VIRTUAL">Virtual</option>
                                <option value="MIXTA">Mixta</option>
                            </select>
                            <div class="text-danger small mt-1" th:errors="*{modalidad}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="fechaInicio">Fecha de inicio</label>
                            <input class="form-control" id="fechaInicio" type="date"
                                   th:field="*{fechaInicio}" required>
                            <div class="text-danger small mt-1" th:errors="*{fechaInicio}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="cupo">Cupo total</label>
                            <input class="form-control" id="cupo" type="number"
                                   th:field="*{cupo}" min="1" max="40" step="1" required>
                            <div class="text-danger small mt-1" th:errors="*{cupo}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="activo">Estado</label>
                            <select class="form-select" id="activo"
                                    th:field="*{activo}" required>
                                <option value="true">Activo</option>
                                <option value="false">Inactivo</option>
                            </select>
                            <div class="text-danger small mt-1" th:errors="*{activo}"></div>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <button class="btn btn-primary" type="submit"
                                th:text="${idCurso != null}
                                ? 'Guardar cambios' : 'Guardar curso'">
                            Guardar curso
                        </button>
                        <a class="btn btn-outline-secondary" th:href="@{/cursos}">Cancelar</a>
                    </div>
                </form>
            </div>
        </section>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
