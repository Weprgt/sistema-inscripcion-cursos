<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Participante | Sistema de inscripción a cursos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container flex-wrap">
        <a class="navbar-brand" th:href="@{/}">Sistema de inscripción a cursos</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navegacionPrincipal" aria-controls="navegacionPrincipal"
                aria-expanded="false" aria-label="Mostrar navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navegacionPrincipal">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/}">Inicio</a>
                <a class="nav-link" th:href="@{/cursos}">Cursos</a>
                <a class="nav-link active" th:href="@{/participantes}">Participantes</a>
                <a class="nav-link" th:href="@{/inscripciones}">Inscripciones</a>
            </div>
        </div>
    </div>
</nav>

<main class="container py-4 py-md-5">
    <div class="mx-auto" style="max-width: 850px;">
        <section class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h2"
                    th:text="${idParticipante != null}
                    ? 'Editar participante' : 'Registrar participante'">
                    Registrar participante
                </h1>
                <p class="text-secondary mb-4">Todos los campos son obligatorios.</p>

                <form th:action="${idParticipante != null}
                  ? @{/participantes/{id}(id=${idParticipante})}
                  : @{/participantes}"
                      th:object="${participante}"
                      method="post">

                    <div class="alert alert-danger"
                         role="alert"
                         th:if="${#fields.hasGlobalErrors()}">
                        <p class="mb-0" th:each="error : ${#fields.globalErrors()}"
                           th:text="${error}"></p>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="nombres">Nombres</label>
                            <input class="form-control" id="nombres" type="text"
                                   th:field="*{nombres}" autocomplete="given-name"
                                   maxlength="100" required>
                            <div class="text-danger small mt-1" th:errors="*{nombres}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="apellidos">Apellidos</label>
                            <input class="form-control" id="apellidos" type="text"
                                   th:field="*{apellidos}" autocomplete="family-name"
                                   maxlength="100" required>
                            <div class="text-danger small mt-1" th:errors="*{apellidos}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="correo">Correo electrónico</label>
                            <input class="form-control" id="correo" type="email"
                                   th:field="*{correo}" autocomplete="email"
                                   maxlength="150" required>
                            <div class="text-danger small mt-1" th:errors="*{correo}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label" for="telefono">Teléfono</label>
                            <input class="form-control" id="telefono" type="tel"
                                   th:field="*{telefono}" autocomplete="tel-national"
                                   inputmode="numeric" pattern="[0-9]{8}" maxlength="8"
                                   title="Ingresa exactamente 8 dígitos" required>
                            <div class="form-text">Número de Guatemala: 8 dígitos, sin +502.</div>
                            <div class="text-danger small mt-1" th:errors="*{telefono}"></div>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <button class="btn btn-primary" type="submit"
                                th:text="${idParticipante != null}
                                ? 'Guardar cambios' : 'Guardar participante'">
                            Guardar participante
                        </button>
                        <a class="btn btn-outline-secondary"
                           th:href="@{/participantes}">Cancelar</a>
                    </div>
                </form>
            </div>
        </section>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
