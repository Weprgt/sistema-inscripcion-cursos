<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de participante</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #243247;
            background: #f3f5f8;
        }

        header {
            padding: 22px 6%;
            color: white;
            background: #243247;
        }

        main {
            max-width: 850px;
            margin: 36px auto;
            padding: 0 20px;
        }

        .panel {
            padding: 28px;
            background: white;
            border-radius: 12px;
        }

        h1 { margin-top: 0; }

        .campos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            font: inherit;
        }

        .error {
            margin-top: 6px;
            color: #b91c1c;
            font-size: 14px;
        }

        .aviso {
            padding: 12px;
            margin-bottom: 20px;
            background: #fee2e2;
            border-radius: 6px;
        }

        .acciones {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-top: 28px;
        }

        button {
            padding: 12px 20px;
            color: white;
            background: #243247;
            border: 0;
            border-radius: 6px;
            font: inherit;
            cursor: pointer;
        }

        a { color: #243247; }

        small {
            display: block;
            margin-top: 6px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            .campos { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
<header>
    <strong>Sistema de inscripción a cursos</strong>
</header>

<main>
    <section class="panel">
        <h1 th:text="${idParticipante != null}
                ? 'Editar participante' : 'Registrar participante'">
            Registrar participante
        </h1>

        <p>Todos los campos son obligatorios.</p>

        <form th:action="${idParticipante != null}
                  ? @{/participantes/{id}(id=${idParticipante})}
                  : @{/participantes}"
              th:object="${participante}"
              method="post">

            <div class="aviso error"
                 role="alert"
                 th:if="${#fields.hasGlobalErrors()}">
                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}"></p>
            </div>

            <div class="campos">
                <div>
                    <label for="nombres">Nombres</label>
                    <input id="nombres"
                           type="text"
                           th:field="*{nombres}"
                           autocomplete="given-name"
                           maxlength="100"
                           required>
                    <p class="error" th:errors="*{nombres}"></p>
                </div>

                <div>
                    <label for="apellidos">Apellidos</label>
                    <input id="apellidos"
                           type="text"
                           th:field="*{apellidos}"
                           autocomplete="family-name"
                           maxlength="100"
                           required>
                    <p class="error" th:errors="*{apellidos}"></p>
                </div>

                <div>
                    <label for="correo">Correo electrónico</label>
                    <input id="correo"
                           type="email"
                           th:field="*{correo}"
                           autocomplete="email"
                           maxlength="150"
                           required>
                    <p class="error" th:errors="*{correo}"></p>
                </div>

                <div>
                    <label for="telefono">Teléfono</label>
                    <input id="telefono"
                           type="tel"
                           th:field="*{telefono}"
                           autocomplete="tel-national"
                           inputmode="numeric"
                           pattern="[0-9]{8}"
                           maxlength="8"
                           title="Ingresa exactamente 8 dígitos"
                           required>
                    <small>
                        Número de Guatemala: 8 dígitos, sin +502.
                    </small>
                    <p class="error" th:errors="*{telefono}"></p>
                </div>
            </div>

            <div class="acciones">
                <button type="submit"
                        th:text="${idParticipante != null}
                            ? 'Guardar cambios' : 'Guardar participante'">
                    Guardar participante
                </button>

                <a th:href="@{/participantes}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
